spring:
  application:
    name: spring-ai-poc
  ai:
    openai:
      # Groq is OpenAI-compatible; Spring AI appends /v1/chat/completions
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
    # Alternative: real OpenAI (needs billing credits)
    # openai:
    #   api-key: ${OPENAI_API_KEY:}
    #   chat:
    #     options:
    #       model: gpt-4o-mini

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
