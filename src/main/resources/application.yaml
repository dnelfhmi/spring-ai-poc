spring:
  application:
    name: spring-ai-poc
  ai:
    openai:
      # Groq is OpenAI-compatible; Spring AI appends /v1/chat/completions
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.7
    # Disable eager ONNX auto-config; we create a lazy bean manually.
    embedding:
      transformer:
        enabled: false

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO