spring:
  application:
    name: spring-ai-poc
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    # Alternative providers (enable by adding the matching starter dependency):
    # anthropic:
    #   api-key: ${ANTHROPIC_API_KEY:}
    #   chat:
    #     options:
    #       model: claude-3-5-sonnet-20241022
    # ollama:
    #   base-url: http://localhost:11434

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
